name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: work/vendor
          key: vendor-${{ matrix.arch }}-${{ hashFiles('release/config.json') }}
      - run: ./build.sh ${{ matrix.arch }}
      - run: ./scripts/test.sh
      - run: ./package.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages-${{ matrix.arch }}
          path: |
            dist/${{ matrix.arch }}/*.dmg
            dist/${{ matrix.arch }}/*.zip
          if-no-files-found: error
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate version tag
        run: |
          python3 - <<'PYCODE'
          import json, os
          assert os.environ['GITHUB_REF_NAME'] == 'v' + json.load(open('release/config.json'))['version']
          PYCODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: packages-*
          path: artifacts
          merge-multiple: true
      - run: python3 scripts/fetch_dependencies.py arm64
      - name: Sign and independently verify updates
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 scripts/make_appcast.py artifacts release-assets
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Published releases must not be overwritten"'
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Image Harbor $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
